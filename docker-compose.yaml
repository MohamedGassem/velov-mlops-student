services:
  api:
    build:
      context: .
      args:
        PYTHON_IMAGE: python:3.12-slim
    image: velov-api:${VELOV_VERSION:-0.1.0}
    container_name: velov-api
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_DIR: /app/models
      DATABASE_URL: postgresql+psycopg://velov:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/velov
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:17-alpine
    container_name: velov-db
    # Pas de section ports : la base reste invisible depuis l'exterieur du reseau Docker.
    environment:
      POSTGRES_USER: velov
      POSTGRES_DB: velov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov -d velov"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
