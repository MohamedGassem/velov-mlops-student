models:
  - name: stg_station_status
    columns:
      - name: station_id
        data_tests: [not_null]
      - name: reported_at
        data_tests: [not_null]

  - name: station_hourly
    config:
      contract:
        enforced: true
    columns:
      - name: station_id
        data_type: integer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_station_information')
                field: station_id
      - name: timestamp
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: capacity
        data_type: integer
      - name: bikes_available
        data_type: integer
        data_tests: [not_null]
      - name: temperature
        data_type: double
        data_tests: [not_null]
      - name: is_raining
        data_type: boolean
