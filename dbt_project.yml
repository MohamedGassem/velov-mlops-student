name: 'velov_pipeline'
version: '1.0.0'
config-version: 2

profile: 'velov'

model-paths: ["dbt/models"]
analysis-paths: ["dbt/analyses"]
test-paths: ["dbt/tests"]
seed-paths: ["dbt/seeds"]
macro-paths: ["dbt/macros"]
snapshot-paths: ["dbt/snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  velov_pipeline:
    silver:
      +materialized: view
    gold:
      +materialized: table