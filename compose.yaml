# Stack locale : API + PostgreSQL (journalisation des prédictions).
# Prérequis : un fichier .env (copier .env.example) et un modèle entraîné dans models/.
# Lancement : docker compose up --build -d
# Arrêt     : docker compose down        (ajouter -v pour supprimer aussi les données)

services:
  api:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    image: velov-api:${TAG:-dev}
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/models
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://velov:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.example}@db:5432/velov
    depends_on:
      db:
        condition: service_healthy  # attendre que Postgres accepte les connexions
    # Redémarre après un arrêt du process (crash), pas quand le healthcheck passe à unhealthy.
    restart: unless-stopped

  db:
    # postgres:17 : à partir de la 18, le répertoire de données attendu change
    # (/var/lib/postgresql), le volume ci-dessous devrait alors être adapté.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, voir .env.example}
      POSTGRES_DB: velov
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Aucun port publié : la base n'est joignable que depuis le réseau du compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov -d velov"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
